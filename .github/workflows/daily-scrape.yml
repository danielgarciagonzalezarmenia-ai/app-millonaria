name: Scraping diario (1 AM Colombia)

on:
  schedule:
    # 06:00 UTC = 01:00 hora de Colombia (UTC-5, sin horario de verano).
    # GitHub Actions siempre corre en UTC.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Cargar credenciales de Firebase
        env:
          # Secret de GitHub: FIREBASE_SERVICE_ACCOUNT_BASE64 (base64 del JSON
          # del service account de Firebase Admin SDK).
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 --decode > /tmp/firebase-sa.json
          test -s /tmp/firebase-sa.json

      - name: Ejecutar scraper (365scores -> Firestore)
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SERVICE_ACCOUNT_PATH: /tmp/firebase-sa.json
          ENV: production
        working-directory: backend
        run: |
          python run_scraper.py
